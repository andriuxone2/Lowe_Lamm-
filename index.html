<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trazabilidad Vinipel</title>
<meta name="description" content="Demo de propuesta — sistema de trazabilidad de producción para Lowe &amp; Lamm S.A.S.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
/* ============ tokens ============ */
:root{
  --bg:#F2F8FC;
  --surface:#FFFFFF;
  --surface-2:#EAF3FA;
  --surface-3:#DCEBF6;
  --border:#C9DEEC;
  --border-soft:#DFEBF4;
  --text:#12262F;
  --text-2:#4A6472;
  --text-3:#7A93A1;
  --brand:#1B6FA8;
  --brand-2:#2E8BC7;
  --brand-ink:#0E4E7A;
  --brand-soft:#DCEBF7;
  --brand-tint:#EDF6FC;
  --on-brand:#FFFFFF;
  --ok:#2A7A52;
  --ok-soft:#DFF0E7;
  --warn:#9A6B08;
  --warn-soft:#FBEFD5;
  --danger:#B34331;
  --danger-soft:#FAE3DE;
  --info:#1B6FA8;
  --info-soft:#DCEBF7;
  --shadow-1:0 1px 2px rgba(16,42,58,.06), 0 1px 3px rgba(16,42,58,.05);
  --shadow-2:0 2px 6px rgba(16,42,58,.07), 0 8px 24px rgba(16,42,58,.08);
  --shadow-3:0 10px 40px rgba(16,42,58,.18);
  --radius:8px;
  --radius-sm:5px;
  --paper:#FFFFFF;
  --paper-ink:#000000;
  --lcd-bg:#12201A;
  --lcd-ink:#5BE58A;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1519;
    --surface:#151E24;
    --surface-2:#1B262D;
    --surface-3:#223038;
    --border:#2A3A44;
    --border-soft:#22303880;
    --text:#E4EDF2;
    --text-2:#9FB4C0;
    --text-3:#728896;
    --brand:#4FA3DA;
    --brand-2:#6DB8E8;
    --brand-ink:#8CCBF2;
    --brand-soft:#17303F;
    --brand-tint:#132630;
    --on-brand:#08191F;
    --ok:#69C093;
    --ok-soft:#152B21;
    --warn:#D9A93F;
    --warn-soft:#2C2415;
    --danger:#E08A75;
    --danger-soft:#2E1D19;
    --info:#4FA3DA;
    --info-soft:#17303F;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 2px 8px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
    --shadow-3:0 12px 44px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1519; --surface:#151E24; --surface-2:#1B262D; --surface-3:#223038;
  --border:#2A3A44; --border-soft:#223038; --text:#E4EDF2; --text-2:#9FB4C0; --text-3:#728896;
  --brand:#4FA3DA; --brand-2:#6DB8E8; --brand-ink:#8CCBF2; --brand-soft:#17303F; --brand-tint:#132630;
  --on-brand:#08191F;
  --ok:#69C093; --ok-soft:#152B21; --warn:#D9A93F; --warn-soft:#2C2415;
  --danger:#E08A75; --danger-soft:#2E1D19; --info:#4FA3DA; --info-soft:#17303F;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 2px 8px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
  --shadow-3:0 12px 44px rgba(0,0,0,.6);
}

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.mono{ font-family:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace; }
h1,h2,h3,h4{ margin:0; font-weight:650; letter-spacing:-.01em; line-height:1.2; }
button{ font:inherit; }
a{ color:var(--brand); }
:focus-visible{ outline:2px solid var(--brand-2); outline-offset:2px; border-radius:4px; }
.hidden{ display:none !important; }

/* ============ login ============ */
#login{
  min-height:100vh; display:grid; place-items:center; padding:24px;
  background:
    radial-gradient(1100px 520px at 12% -10%, var(--brand-soft), transparent 62%),
    radial-gradient(900px 480px at 105% 110%, var(--brand-tint), transparent 60%),
    var(--bg);
}
.login-card{
  width:100%; max-width:940px; background:var(--surface); border:1px solid var(--border);
  border-radius:14px; box-shadow:var(--shadow-3); overflow:hidden;
  display:grid; grid-template-columns:1.05fr .95fr;
}
.login-brand{
  background:linear-gradient(158deg, var(--brand) 0%, var(--brand-ink) 100%);
  color:#fff; padding:44px 40px; display:flex; flex-direction:column; gap:18px;
}
.login-brand .lion{ width:76px; height:76px; color:#fff; }
.login-brand h1{ font-size:1.5rem; letter-spacing:-.02em; }
.login-brand .lead{ font-size:.92rem; opacity:.88; line-height:1.6; max-width:34ch; }
.login-brand .feats{ margin-top:auto; display:flex; flex-direction:column; gap:9px; font-size:.83rem; opacity:.9; }
.login-brand .feats div{ display:flex; gap:9px; align-items:flex-start; }
.login-brand .feats svg{ width:15px; height:15px; flex:none; margin-top:2px; }
.login-form{ padding:40px 38px; display:flex; flex-direction:column; }
.login-form h2{ font-size:1.18rem; margin-bottom:4px; }
.login-form .hint{ color:var(--text-2); font-size:.86rem; margin-bottom:22px; }
.demo-users{ display:grid; gap:10px; margin-bottom:20px; }
.demo-user{
  display:flex; gap:12px; align-items:center; text-align:left; cursor:pointer;
  background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius);
  padding:12px 14px; transition:.14s; color:inherit; width:100%;
}
.demo-user:hover{ background:var(--brand-soft); border-color:var(--brand-2); transform:translateY(-1px); }
.demo-user.sel{ background:var(--brand-soft); border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-tint); }
.demo-user .av{
  width:38px; height:38px; border-radius:50%; flex:none; display:grid; place-items:center;
  background:var(--brand); color:var(--on-brand); font-weight:700; font-size:.82rem;
}
.demo-user .who{ font-weight:650; font-size:.9rem; }
.demo-user .role{ font-size:.76rem; color:var(--text-2); }
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:.78rem; font-weight:600; color:var(--text-2); margin-bottom:5px; }
input,select,textarea{
  width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:var(--radius-sm);
  background:var(--surface); color:var(--text); font:inherit; transition:.12s;
}
input:focus,select:focus,textarea:focus{ border-color:var(--brand-2); box-shadow:0 0 0 3px var(--brand-tint); outline:none; }
input[readonly]{ background:var(--surface-2); color:var(--text-2); }
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:9px 16px; border-radius:var(--radius-sm); border:1px solid transparent;
  background:var(--brand); color:var(--on-brand); font-weight:600; font-size:.87rem;
  cursor:pointer; transition:.13s; white-space:nowrap;
}
.btn:hover{ background:var(--brand-2); }
.btn:active{ transform:translateY(1px); }
.btn.block{ width:100%; }
.btn.ghost{ background:var(--surface); color:var(--text); border-color:var(--border); }
.btn.ghost:hover{ background:var(--surface-2); border-color:var(--brand-2); }
.btn.sm{ padding:6px 11px; font-size:.8rem; }
.btn.danger{ background:var(--danger); }
.btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; }
.btn svg{ width:15px; height:15px; }

/* ============ app shell ============ */
#app{ min-height:100vh; display:grid; grid-template-columns:238px 1fr; }
.side{
  background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.side-top{ padding:16px 16px 14px; border-bottom:1px solid var(--border-soft); display:flex; gap:11px; align-items:center; }
.side-top .lion{ width:34px; height:34px; color:var(--brand); flex:none; }
.side-top .nm{ font-weight:700; font-size:.9rem; letter-spacing:-.01em; }
.side-top .sb{ font-size:.68rem; color:var(--text-3); text-transform:uppercase; letter-spacing:.09em; }
.nav{ padding:10px 9px; flex:1; }
.nav-group{ margin-bottom:14px; }
.nav-group > .nav-lbl{
  font-size:.65rem; text-transform:uppercase; letter-spacing:.11em; color:var(--text-3);
  padding:6px 9px; font-weight:700;
}
.nav a{
  display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:6px;
  color:var(--text-2); text-decoration:none; font-size:.855rem; font-weight:500; transition:.12s;
}
.nav a:hover{ background:var(--surface-2); color:var(--text); }
.nav a.on{ background:var(--brand-soft); color:var(--brand-ink); font-weight:650; }
.nav a svg{ width:16px; height:16px; flex:none; opacity:.85; }
.nav a .badge{
  margin-left:auto; background:var(--brand); color:var(--on-brand); font-size:.66rem;
  font-weight:700; padding:1px 6px; border-radius:99px; min-width:19px; text-align:center;
}
.side-bot{ padding:11px; border-top:1px solid var(--border-soft); }
.userbox{ display:flex; gap:10px; align-items:center; padding:7px 8px; border-radius:6px; background:var(--surface-2); }
.userbox .av{ width:30px; height:30px; border-radius:50%; background:var(--brand); color:var(--on-brand);
  display:grid; place-items:center; font-weight:700; font-size:.72rem; flex:none; }
.userbox .who{ font-size:.8rem; font-weight:650; line-height:1.25; }
.userbox .role{ font-size:.7rem; color:var(--text-2); }
.userbox .out{ margin-left:auto; background:none; border:none; cursor:pointer; color:var(--text-3); padding:4px; display:grid; }
.userbox .out:hover{ color:var(--danger); }
.userbox .out svg{ width:16px; height:16px; }

.main{ min-width:0; display:flex; flex-direction:column; }
.topbar{
  background:var(--surface); border-bottom:1px solid var(--border); padding:0 22px;
  height:56px; display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:30;
}
.topbar .crumb{ font-size:.72rem; color:var(--text-3); text-transform:uppercase; letter-spacing:.09em; font-weight:650; }
.topbar h2{ font-size:1.02rem; }
.topbar .spacer{ flex:1; }
.iconbtn{
  background:var(--surface-2); border:1px solid var(--border); border-radius:6px; cursor:pointer;
  width:32px; height:32px; display:grid; place-items:center; color:var(--text-2); transition:.12s;
}
.iconbtn:hover{ background:var(--brand-soft); color:var(--brand-ink); border-color:var(--brand-2); }
.iconbtn svg{ width:16px; height:16px; }
.iconbtn.on{ background:var(--brand); color:var(--on-brand); border-color:var(--brand); }
.view{ padding:22px; flex:1; max-width:1420px; width:100%; }

/* ============ generic ui ============ */
.page-head{ display:flex; align-items:flex-end; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
.page-head .t h3{ font-size:1.22rem; }
.page-head .t p{ margin:3px 0 0; color:var(--text-2); font-size:.86rem; max-width:70ch; }
.page-head .acts{ margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }

.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-1); }
.card-h{ padding:13px 17px; border-bottom:1px solid var(--border-soft); display:flex; align-items:center; gap:11px; }
.card-h h4{ font-size:.92rem; }
.card-h .sub{ font-size:.78rem; color:var(--text-2); }
.card-h .acts{ margin-left:auto; display:flex; gap:7px; }
.card-b{ padding:17px; }
.card-b.flush{ padding:0; }

.grid{ display:grid; gap:14px; }
.g2{ grid-template-columns:repeat(2,1fr); }
.g3{ grid-template-columns:repeat(3,1fr); }
.g4{ grid-template-columns:repeat(4,1fr); }
@media(max-width:1100px){ .g4{grid-template-columns:repeat(2,1fr);} .g3{grid-template-columns:repeat(2,1fr);} }
@media(max-width:760px){ .g2,.g3,.g4{grid-template-columns:1fr;} }

.kpi{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:15px 17px; box-shadow:var(--shadow-1); }
.kpi .k{ font-size:.7rem; text-transform:uppercase; letter-spacing:.09em; color:var(--text-3); font-weight:700; }
.kpi .v{ font-size:1.85rem; font-weight:700; letter-spacing:-.025em; margin-top:5px; font-variant-numeric:tabular-nums; }
.kpi .v small{ font-size:.9rem; font-weight:600; color:var(--text-2); margin-left:3px; }
.kpi .d{ font-size:.76rem; color:var(--text-2); margin-top:3px; }

.tblwrap{ overflow-x:auto; }
table.data{ width:100%; border-collapse:collapse; font-size:.845rem; }
table.data th{
  text-align:left; padding:9px 13px; background:var(--surface-2); color:var(--text-2);
  font-size:.68rem; text-transform:uppercase; letter-spacing:.07em; font-weight:700;
  border-bottom:1px solid var(--border); white-space:nowrap; position:sticky; top:0;
}
table.data td{ padding:9px 13px; border-bottom:1px solid var(--border-soft); vertical-align:middle; }
table.data tbody tr:last-child td{ border-bottom:none; }
table.data tbody tr:hover{ background:var(--brand-tint); }
table.data tr.sel-row{ background:var(--brand-soft); }
table.data td.num{ text-align:right; font-variant-numeric:tabular-nums; font-family:"IBM Plex Mono",monospace; }
table.data .rowacts{ display:flex; gap:5px; justify-content:flex-end; }

.tag{ display:inline-flex; align-items:center; gap:5px; font-size:.7rem; font-weight:700;
  padding:2px 8px; border-radius:99px; letter-spacing:.02em; white-space:nowrap; }
.tag.extruido{ background:var(--info-soft); color:var(--info); }
.tag.perfilado{ background:var(--warn-soft); color:var(--warn); }
.tag.pesado{ background:var(--ok-soft); color:var(--ok); }
.tag.despachado{ background:var(--surface-3); color:var(--text-2); }
.tag.rechazado{ background:var(--danger-soft); color:var(--danger); }
.tag.on{ background:var(--ok-soft); color:var(--ok); }
.tag.off{ background:var(--danger-soft); color:var(--danger); }
.tag.n{ background:var(--surface-3); color:var(--text-2); }

.empty{ padding:44px 20px; text-align:center; color:var(--text-3); }
.empty svg{ width:36px; height:36px; opacity:.4; margin-bottom:10px; }
.empty p{ margin:0; font-size:.87rem; }

.toolbar{ display:flex; gap:9px; padding:11px 13px; border-bottom:1px solid var(--border-soft); flex-wrap:wrap; align-items:center; }
.toolbar input,.toolbar select{ width:auto; min-width:150px; padding:7px 10px; font-size:.83rem; }
.toolbar .sp{ flex:1; }

.scanfield{ position:relative; }
.scanfield input{ padding-left:36px; font-family:"IBM Plex Mono",monospace; letter-spacing:.06em; }
.scanfield .ic{ position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--brand); pointer-events:none; }
.scanfield .ic svg{ width:16px; height:16px; display:block; }
.scanfield.armed input{ border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-tint); }

.steps{ display:flex; gap:0; margin-bottom:18px; flex-wrap:wrap; }
.step{ display:flex; align-items:center; gap:9px; padding:9px 16px 9px 13px; background:var(--surface);
  border:1px solid var(--border); font-size:.8rem; color:var(--text-2); position:relative; }
.step:first-child{ border-radius:var(--radius) 0 0 var(--radius); }
.step:last-child{ border-radius:0 var(--radius) var(--radius) 0; }
.step + .step{ border-left:none; }
.step .n{ width:20px; height:20px; border-radius:50%; background:var(--surface-3); color:var(--text-2);
  display:grid; place-items:center; font-size:.68rem; font-weight:700; flex:none; }
.step.done{ background:var(--ok-soft); color:var(--ok); border-color:var(--ok-soft); }
.step.done .n{ background:var(--ok); color:#fff; }
.step.now{ background:var(--brand-soft); color:var(--brand-ink); border-color:var(--brand-2); font-weight:650; }
.step.now .n{ background:var(--brand); color:var(--on-brand); }

.formgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:13px; }
.formgrid .full{ grid-column:1/-1; }
.helper{ font-size:.74rem; color:var(--text-3); margin-top:4px; }
.calc{ background:var(--brand-tint); border:1px dashed var(--brand-2); border-radius:var(--radius-sm);
  padding:9px 12px; font-size:.8rem; color:var(--brand-ink); display:flex; gap:8px; align-items:center; }
.calc svg{ width:15px; height:15px; flex:none; }

/* ============ modal ============ */
.modal-bg{ position:fixed; inset:0; background:rgba(12,30,42,.5); backdrop-filter:blur(3px);
  display:grid; place-items:center; z-index:200; padding:20px; }
.modal{ background:var(--surface); border-radius:12px; box-shadow:var(--shadow-3); width:100%;
  max-width:min(560px,100%); min-width:0; max-height:90vh; display:flex; flex-direction:column; border:1px solid var(--border); }
.modal.wide{ max-width:min(860px,100%); }
.modal.xwide{ max-width:min(1000px,100%); }
.modal-h{ padding:16px 20px; border-bottom:1px solid var(--border-soft); display:flex; align-items:center; gap:12px; }
.modal-h h4{ font-size:1rem; }
.modal-h .x{ margin-left:auto; background:none; border:none; cursor:pointer; color:var(--text-3); padding:4px; display:grid; }
.modal-h .x:hover{ color:var(--danger); }
.modal-h .x svg{ width:18px; height:18px; }
.modal-b{ padding:20px; overflow-y:auto; }
.modal-f{ padding:14px 20px; border-top:1px solid var(--border-soft); display:flex; gap:9px; justify-content:flex-end; }

/* ============ toast ============ */
#toasts{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:400;
  display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
.toast{ background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--brand);
  border-radius:var(--radius-sm); box-shadow:var(--shadow-2); padding:11px 16px; font-size:.86rem;
  display:flex; gap:10px; align-items:center; animation:tin .22s ease-out; max-width:min(460px,92vw); }
.toast.ok{ border-left-color:var(--ok); }
.toast.err{ border-left-color:var(--danger); }
.toast svg{ width:17px; height:17px; flex:none; }
.toast.ok svg{ color:var(--ok); } .toast.err svg{ color:var(--danger); } .toast svg{ color:var(--brand); }
@keyframes tin{ from{ opacity:0; transform:translateY(10px);} to{opacity:1;transform:none;} }

/* ============ hardware simulator ============ */
#hw{
  position:fixed; right:16px; bottom:16px; z-index:150; width:296px;
  background:var(--surface); border:1px solid var(--border); border-radius:11px;
  box-shadow:var(--shadow-3); overflow:hidden; transition:.2s;
}
#hw.min{ width:190px; }
#hw .hw-h{ background:var(--surface-2); padding:9px 12px; display:flex; align-items:center; gap:9px;
  border-bottom:1px solid var(--border); cursor:pointer; user-select:none; }
#hw .hw-h .dot{ width:7px; height:7px; border-radius:50%; background:var(--ok); flex:none;
  box-shadow:0 0 0 3px var(--ok-soft); animation:pulse 2.4s infinite; }
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.45} }
#hw .hw-h .ttl{ font-size:.78rem; font-weight:700; letter-spacing:-.01em; }
#hw .hw-h .chev{ margin-left:auto; color:var(--text-3); transition:.2s; }
#hw .hw-h .chev svg{ width:15px; height:15px; display:block; }
#hw.min .chev{ transform:rotate(180deg); }
#hw .hw-b{ padding:12px; display:flex; flex-direction:column; gap:13px; max-height:64vh; overflow-y:auto; }
#hw.min .hw-b{ display:none; }
.dev{ border:1px solid var(--border); border-radius:8px; overflow:hidden; }
.dev-h{ padding:7px 10px; background:var(--surface-2); display:flex; align-items:center; gap:7px;
  font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-2); }
.dev-h svg{ width:13px; height:13px; }
.dev-h .sw{ margin-left:auto; }
.dev-b{ padding:10px; display:flex; flex-direction:column; gap:9px; }
.dev-b.off{ opacity:.4; pointer-events:none; }
.switch{ position:relative; width:30px; height:17px; background:var(--surface-3); border-radius:99px;
  cursor:pointer; transition:.16s; border:none; padding:0; }
.switch::after{ content:""; position:absolute; top:2px; left:2px; width:13px; height:13px;
  background:#fff; border-radius:50%; transition:.16s; box-shadow:0 1px 2px rgba(0,0,0,.3); }
.switch.on{ background:var(--ok); }
.switch.on::after{ transform:translateX(13px); }
.lcd{
  background:var(--lcd-bg); border-radius:5px; padding:9px 11px; text-align:right;
  font-family:"IBM Plex Mono",monospace; color:var(--lcd-ink);
  box-shadow:inset 0 1px 5px rgba(0,0,0,.6); position:relative;
}
.lcd .w{ font-size:1.55rem; font-weight:600; letter-spacing:-.01em; line-height:1.1; font-variant-numeric:tabular-nums; }
.lcd .w small{ font-size:.72rem; opacity:.7; margin-left:3px; }
.lcd .st{ font-size:.58rem; text-transform:uppercase; letter-spacing:.13em; opacity:.65; text-align:left;
  position:absolute; left:11px; bottom:10px; }
.lcd.unstable .w{ opacity:.75; }
.dev select,.dev input{ font-size:.78rem; padding:6px 8px; }
.dev .row{ display:flex; gap:6px; }
.dev .row .btn{ flex:1; padding:6px 9px; font-size:.75rem; }
.hw-note{ font-size:.68rem; color:var(--text-3); line-height:1.45; padding:0 2px; }
.scan-beam{ position:fixed; inset:0; pointer-events:none; z-index:500; display:none; }
.scan-beam.go{ display:block; animation:beam .5s ease-out; }
@keyframes beam{ 0%{ box-shadow:inset 0 0 0 3px var(--brand); opacity:.85 } 100%{ box-shadow:inset 0 0 0 3px transparent; opacity:0 } }

/* ============ label ============ */
.label-stage{ background:var(--surface-3); padding:12px; overflow-x:auto; border-radius:var(--radius); display:grid; place-items:center; }
.lbl{
  width:400px; flex:none; background:var(--paper); color:var(--paper-ink); padding:12px 14px 10px;
  font-family:"IBM Plex Mono",monospace; box-shadow:var(--shadow-2); position:relative; border-radius:2px;
}
.lbl .corner{ position:absolute; left:9px; top:9px; width:16px; height:16px;
  border-left:1.5px solid #000; border-top:1.5px solid #000; }
.lbl-top{ display:flex; gap:10px; align-items:flex-start; margin-bottom:7px; }
.lbl-top .lion{ width:52px; height:52px; color:#000; flex:none; margin-left:4px; margin-top:2px; }
.lbl-top .co{ flex:1; text-align:center; padding-top:5px; }
.lbl-top .co .nm{ font-size:.98rem; font-weight:700; letter-spacing:.01em; }
.lbl-top .co .ref{ font-size:1.05rem; font-weight:700; margin-top:1px; }
.lbl-rows{ font-size:.72rem; }
.lbl-row{ display:flex; justify-content:space-between; gap:12px; padding:1px 0; }
.lbl-row .k{ font-weight:600; }
.lbl-row .v{ font-weight:600; }
.lbl-mid{ display:flex; gap:8px; align-items:flex-end; margin-top:6px; }
.lbl-bc{ flex:none; }
.lbl-bc svg{ display:block; }
.lbl-bc .digits{ font-size:.7rem; text-align:center; letter-spacing:.09em; margin-top:1px; }
.lbl-right{ flex:1; font-size:.655rem; text-align:right; padding-bottom:15px; display:flex; flex-direction:column; gap:3px; white-space:nowrap; }
.lbl-right .b{ font-weight:700; }
.lbl.plus .lbl-rows{ font-size:.68rem; }
.lbl-extra{ margin-top:6px; padding-top:5px; border-top:1px dashed #999; font-size:.62rem;
  display:grid; grid-template-columns:1fr 1fr; gap:1px 10px; }
.lbl-extra span{ display:flex; justify-content:space-between; gap:6px; }

.trace-line{ position:relative; padding-left:30px; }
.trace-line::before{ content:""; position:absolute; left:9px; top:6px; bottom:6px; width:2px; background:var(--border); }
.trace-i{ position:relative; padding:0 0 20px; }
.trace-i:last-child{ padding-bottom:0; }
.trace-i::before{
  content:""; position:absolute; left:-25px; top:4px; width:12px; height:12px; border-radius:50%;
  background:var(--brand); box-shadow:0 0 0 3px var(--surface), 0 0 0 5px var(--brand-soft);
}
.trace-i.pend::before{ background:var(--surface-3); box-shadow:0 0 0 3px var(--surface), 0 0 0 5px var(--border); }
.trace-i .ttl{ font-size:.88rem; font-weight:650; display:flex; gap:9px; align-items:center; flex-wrap:wrap; }
.trace-i .meta{ font-size:.75rem; color:var(--text-3); font-family:"IBM Plex Mono",monospace; margin-top:1px; }
.trace-i .det{ margin-top:7px; display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:7px 16px; }
.trace-i .det div{ font-size:.78rem; }
.trace-i .det .k{ color:var(--text-3); font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; font-weight:700; }

.bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:9px; font-size:.8rem; }
.bar-row .nm{ width:92px; flex:none; color:var(--text-2); }
.bar-row .track{ flex:1; height:20px; background:var(--surface-2); border-radius:4px; overflow:hidden; }
.bar-row .fill{ height:100%; background:linear-gradient(90deg,var(--brand),var(--brand-2)); border-radius:4px; transition:width .5s; }
.bar-row .vl{ width:74px; text-align:right; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:.78rem; }

.pickable{ cursor:pointer; }
.selbox{ display:flex; align-items:center; gap:8px; }
input[type=checkbox]{ width:15px; height:15px; accent-color:var(--brand); cursor:pointer; }

.banner{ background:var(--brand-tint); border:1px solid var(--brand-soft); border-left:3px solid var(--brand);
  border-radius:var(--radius-sm); padding:11px 15px; font-size:.83rem; color:var(--text); margin-bottom:16px;
  display:flex; gap:10px; align-items:flex-start; }
.banner svg{ width:16px; height:16px; flex:none; color:var(--brand); margin-top:1px; }
.banner b{ font-weight:650; }

@media(max-width:900px){
  #app{ grid-template-columns:1fr; }
  .side{ position:fixed; left:0; top:0; z-index:100; width:238px; transform:translateX(-100%); transition:.2s; }
  .side.open{ transform:none; box-shadow:var(--shadow-3); }
  .login-card{ grid-template-columns:1fr; }
  .login-brand{ padding:28px 26px; }
  .login-brand .feats{ display:none; }
  .login-form{ padding:26px 24px; }
  .view{ padding:15px; }
  #hw{ right:10px; bottom:10px; width:270px; }
}
@media(min-width:901px){ .menu-btn{ display:none; } }

input.got{ border-color:var(--ok); box-shadow:0 0 0 3px var(--ok-soft); animation:got .5s ease-out; }
@keyframes got{ 0%{ background:var(--ok-soft);} 100%{ background:var(--surface);} }

@media(min-width:1280px){
  html.hw-open .view{ padding-right:336px; }
}
.userbox .who{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:118px; display:inline-block; }

/* Los hijos de grid/flex deben poder encogerse por debajo de su contenido
   para que los contenedores con scroll propio funcionen. */
.grid > *{ min-width:0; }
.modal-b, .card, .card-b, .label-stage, .tblwrap{ min-width:0; }

/* La etiqueta mantiene su tamaño real; en columnas estrechas se reduce
   proporcionalmente en vez de recortarse. */
.label-stage.fit{ padding:14px 8px; }
.label-stage.fit .lbl{ zoom:.84; }
@supports not (zoom: 1){ .label-stage.fit{ overflow-x:auto; } }

@media print{
  body *{ visibility:hidden; }
  .modal-b, .modal-b *{ visibility:visible; }
  .modal-bg{ position:absolute; inset:0; background:#fff; display:block; padding:0; }
  .modal{ max-width:none; border:none; box-shadow:none; }
  .modal-h,.modal-f,.banner,.helper{ display:none !important; }
  .label-stage{ background:#fff; }
}

  </div>
  <div class="hw-b"></div>
</div>

const MESES = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

  largoTubo: pulgadas => +(pulgadas * 2.54 + 2).toFixed(1),
  // Regla 5 — equivalencia de calibre
  micras: diezmil => diezmil === 4 ? 10 : diezmil === 5 ? 12 : +(diezmil * 2.54).toFixed(1)
};

const fmtFecha = d => `${String(d.getDate()).padStart(2,'0')}-${MESES[d.getMonth()]}-${String(d.getFullYear()).slice(2)}`;
const fmtHora = d => {
  let h = d.getHours(), m = String(d.getMinutes()).padStart(2,'0');
  const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
  return `${String(h).padStart(2,'0')}:${m} ${ap}`;
};
const fmtISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmtDT = iso => { const d = new Date(iso); return `${fmtFecha(d)} ${fmtHora(d)}`; };
const kg = n => (n === null || n === undefined || n === '') ? '—' : Number(n).toFixed(2);

/* Códigos — hoja 9.2 */

/* ==========================================================================
   Code 128 — codificador real (subconjunto B), no una imitación visual.
   El SVG que produce es escaneable por un lector físico o por una app de móvil,
   lo que permite demostrar el flujo con hardware real si el cliente lo pide.
   ========================================================================== */
const C128 = ["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213",
"221312","231212","112232","122132","122231","113222","123122","123221","223211","221132",
"221231","213212","223112","312131","311222","321122","321221","312212","322112","322211",
"212123","212321","232121","111323","131123","131321","112313","132113","132311","211313",
"231113","231311","112133","112331","132131","113123","113321","133121","313121","211331",
"231131","213113","213311","213131","311123","311321","331121","312113","312311","332111",
"314111","221411","431111","111224","111422","121124","121421","141122","141221","112214",
"112412","122114","122411","142112","142211","241211","221114","413111","241112","134111",
"111242","121142","121241","114212","124112","124211","411212","421112","421211","212141",
"214121","412121","111143","111341","131141","114113","114311","411113","411311","113141",
"114131","311141","411131","211412","211214","211232","2331112"];

const START_B = 104, STOP = 106;

function code128Widths(text){
  const vals = [START_B];
  for (const ch of String(text)){
    const c = ch.charCodeAt(0);
    vals.push(c >= 32 && c <= 126 ? c - 32 : 0);
  }
  let sum = START_B;
  for (let i = 1; i < vals.length; i++) sum += vals[i] * i;
  vals.push(sum % 103);
  vals.push(STOP);
  return vals.map(v => C128[v]).join('');
}

/**
 * Devuelve el SVG de un código Code128.
 * @param {string} text  contenido a codificar
 * @param {object} o     { module: ancho de módulo px, height: alto px }
 */
function barcodeSVG(text, o = {}){
  const mod = o.module || 1.35, h = o.height || 46;
  const widths = code128Widths(text);
  let x = 0, bars = '', dark = true;
  for (const w of widths){
    const px = Number(w) * mod;
    if (dark) bars += `<rect x="${x.toFixed(2)}" y="0" width="${px.toFixed(2)}" height="${h}"/>`;
    x += px; dark = !dark;
  }
  return `<svg width="${x.toFixed(1)}" height="${h}" viewBox="0 0 ${x.toFixed(1)} ${h}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect width="${x.toFixed(1)}" height="${h}" fill="#fff"/><g fill="#000">${bars}</g></svg>`;
}

/* ==========================================================================
   Simulador de hardware de planta
   Reproduce el comportamiento real de los equipos para que el cliente vea
   el flujo tal como ocurriría en piso, sin necesitar los equipos conectados.

   · Lector de código de barras: emite pulsaciones de teclado carácter a
     carácter y un Enter final — exactamente como un lector USB tipo teclado.
   · Báscula: el peso sube, oscila y se estabiliza antes de poder enviarse,
     igual que un indicador de peso real.
   ========================================================================== */

const HW = {
  lectorOn: true,
  basculaOn: true,
  peso: 0,
  estable: false,
  cargando: false,
  autoEnviar: false,
  _t: null
};

/* --------- Lector de código de barras --------- */

/** Campo destino: el que tiene el foco, o el primer campo de escaneo de la vista. */
function scanTarget(){
  const a = document.activeElement;
  if (a && a.tagName === 'INPUT' && a.dataset.scan !== undefined) return a;
  return document.querySelector('[data-scan]');
}

function beam(){
  const b = document.getElementById('beam');
  if (!b) return;
  b.classList.remove('go'); void b.offsetWidth; b.classList.add('go');
}

/** Simula un escaneo: teclea el código y dispara Enter, como un lector real. */
async function scanCode(code){
  if (!HW.lectorOn){ toast('El lector está desconectado — actívalo en el simulador', 'err'); return; }
  const t = scanTarget();
  if (!t){ toast('No hay ningún campo de escaneo en esta pantalla', 'err'); return; }
  beam();
  try { navigator.vibrate && navigator.vibrate(30); } catch(e){}
  t.focus(); t.value = '';
  for (const ch of code){
    t.value += ch;
    t.dispatchEvent(new Event('input', { bubbles:true }));
    await sleep(14);
  }
  await sleep(60);
  t.dispatchEvent(new KeyboardEvent('keydown', { key:'Enter', bubbles:true }));
  const form = t.closest('form');
  if (form) form.dispatchEvent(new Event('submit', { bubbles:true, cancelable:true }));
}

/* --------- Báscula --------- */

function basculaTarget(){ return document.querySelector('[data-scale]'); }

/** Simula colocar un rollo: el peso sube, oscila y luego se estabiliza. */
function basculaColocar(pesoObjetivo){
  if (!HW.basculaOn){ toast('La báscula está desconectada — actívala en el simulador', 'err'); return; }
  clearInterval(HW._t);
  HW.cargando = true; HW.estable = false;
  const objetivo = pesoObjetivo != null ? pesoObjetivo : +(6 + Math.random() * 32).toFixed(2);
  let t = 0;
  HW._t = setInterval(() => {
    t += 1;
    if (t <= 12){
      // subida con inercia
      HW.peso = +(objetivo * (1 - Math.exp(-t / 3.2)) + (Math.random() - .5) * 1.4).toFixed(2);
    } else if (t <= 22){
      // oscilación decreciente antes de estabilizar
      HW.peso = +(objetivo + (Math.random() - .5) * (2.2 / (t - 10))).toFixed(2);
    } else {
      HW.peso = objetivo; HW.estable = true; HW.cargando = false;
      clearInterval(HW._t); HW._t = null;
      renderHW();
      if (HW.autoEnviar) basculaEnviar();
      return;
    }
    renderHW();
  }, 90);
  renderHW();
}

function basculaTarar(){
  clearInterval(HW._t); HW._t = null;
  HW.peso = 0; HW.estable = false; HW.cargando = false;
  renderHW();
}

function basculaEnviar(){
  if (!HW.basculaOn){ toast('La báscula está desconectada', 'err'); return; }
  if (!HW.estable){ toast('Espera a que el peso se estabilice', 'err'); return; }
  const t = basculaTarget();
  if (!t){ toast('Abre la estación de Báscula para recibir el peso', 'err'); return; }
  t.value = HW.peso.toFixed(2);
  t.dispatchEvent(new Event('input', { bubbles:true }));
  t.classList.add('got');
  toast(`Peso recibido de la báscula: ${HW.peso.toFixed(2)} kg`, 'ok');
}

  b.innerHTML = `

        </div>

      </div>
    </div>

    <div class="dev">
      <div class="dev-h">
        ${ICO.scale}<span>Báscula de planta</span>
        <button class="switch sw ${HW.basculaOn?'on':''}" onclick="HW.basculaOn=!HW.basculaOn;renderHW()"
                aria-label="Conectar o desconectar la báscula"></button>
      </div>
      <div class="dev-b ${HW.basculaOn?'':'off'}">
        <div class="lcd ${HW.estable?'':'unstable'}">
          <div class="st">${HW.cargando ? 'Estabilizando…' : HW.estable ? '● Estable' : 'Vacía'}</div>

    </div>

    <div class="hw-note">
      Apaga un equipo para mostrarle al cliente cómo opera el sistema cuando el
      hardware no está disponible: la captura manual sigue funcionando.
    </div>`;
}

function toggleHW(){
  const min = document.getElementById('hw').classList.toggle('min');
  document.documentElement.classList.toggle('hw-open', !min);

/* El panel es fijo. En pantallas anchas el contenido le cede espacio;

})();

function pickUser(login){
  $$('.demo-user').forEach(b => b.classList.toggle('sel', b.dataset.login === login));

  if (u){ $('#lg-u').value = u.login; $('#lg-p').value = 'demo'; }
}
function doLogin(e){
  e.preventDefault();
  const u = DB.usuarios.find(x => x.login === $('#lg-u').value.trim().toLowerCase() && x.estado === 'activo');
  if (!u || $('#lg-p').value !== u.pass){ toast('Usuario o contraseña incorrectos', 'err'); return; }
  SESSION = u; bitacora('Inicio de sesión', u.nombre); save();
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden'); $('#hw').classList.remove('hidden');
  renderShell(); location.hash = '#/tablero'; route(); renderHW();
}
function logout(){
  bitacora('Cierre de sesión', SESSION.nombre); save(); SESSION = null;
  $('#app').classList.add('hidden'); $('#hw').classList.add('hidden'); $('#login').classList.remove('hidden');
  renderLogin();

const VIEWS = {};
function route(){
  if (!SESSION) return;
  let h = (location.hash || '#/tablero').replace('#/', '');
  const [name, arg] = h.split('/');
  const fn = VIEWS[name] || VIEWS.tablero;
  const grupo = NAV.find(g => g.items.some(i => i.h === name));
  if (grupo && grupo.admin && !puedeEditarParams()){
    toast('Tu perfil no tiene acceso a Administración', 'err');
    location.hash = '#/tablero'; return;
  }
  $$('.nav a').forEach(a => a.classList.toggle('on', a.dataset.h === name));
  const item = grupo && grupo.items.find(i => i.h === name);
  $('#crumb').textContent = grupo ? grupo.g : 'Operación';
  $('#ptitle').textContent = item ? item.t : 'Tablero';
  $('#view').innerHTML = fn(arg);
  $('#side').classList.remove('open');
  const sf = $('[data-scan]'); if (sf) sf.focus();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

function tabla(cols, rows, opts = {}){
  if (!rows.length) return vacio(opts.empty || 'No hay registros para mostrar');
  return `<div class="tblwrap"><table class="data">
    <thead><tr>${cols.map(c => `<th${c.num?' style="text-align:right"':''}>${c.t}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr ${opts.rowAttr ? opts.rowAttr(r) : ''}>${
      cols.map(c => `<td class="${c.num?'num':''}">${c.f(r)}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}

function campo(f, val){
  const v = val ?? f.def ?? '';
  if (f.type === 'select')
    return `<div class="field${f.full?' full':''}"><label for="f-${f.k}">${f.t}${f.req?' *':''}</label>
      <select id="f-${f.k}" ${f.on?`oninput="${f.on}"`:''}>${f.opts.map(o =>
        `<option value="${esc(o.v)}" ${String(o.v)===String(v)?'selected':''}>${esc(o.t)}</option>`).join('')}</select>
      ${f.help?`<div class="helper">${f.help}</div>`:''}</div>`;
  if (f.type === 'textarea')
    return `<div class="field full"><label for="f-${f.k}">${f.t}</label>
      <textarea id="f-${f.k}" rows="2">${esc(v)}</textarea></div>`;
  return `<div class="field${f.full?' full':''}"><label for="f-${f.k}">${f.t}${f.req?' *':''}</label>
    <input id="f-${f.k}" type="${f.type||'text'}" ${f.step?`step="${f.step}"`:''} ${f.ro?'readonly':''}
      value="${esc(v)}" ${f.on?`oninput="${f.on}"`:''} ${f.ph?`placeholder="${esc(f.ph)}"`:''} ${f.attrs||''}>
    ${f.help?`<div class="helper">${f.help}</div>`:''}</div>`;
}
function leerCampos(fields){
  const o = {};
  for (const f of fields){
    const el = $(`#f-${f.k}`); if (!el) continue;
    let v = el.value;
    if (f.type === 'number') v = v === '' ? null : Number(v);
    if (f.req && (v === '' || v === null)){ toast(`Falta: ${f.t}`, 'err'); return null; }
    o[f.k] = v;
  }
  return o;
}

/** Genera el CSV y lo entrega al visitante. Requerimiento RF-29 ("poder exportar en Excel"). */
async function exportarCSV(nombre, cols, rows){
  const head = cols.map(c => `"${c.t}"`).join(';');
  const body = rows.map(r => cols.map(c => {
    const raw = (c.raw ? c.raw(r) : String(c.f(r)).replace(/<[^>]+>/g,'')).toString().replace(/"/g,'""');
    return `"${raw}"`;
  }).join(';')).join('\n');
  const texto = '﻿' + head + '\n' + body;   // BOM para que Excel respete los acentos

  // En la página publicada la descarga la media el visor y requiere confirmación.
  let downloads = null;
  try { if (typeof claude !== 'undefined' && claude.use) downloads = await claude.use('downloads'); } catch(e){}

  if (downloads){
    for (const ext of ['csv', 'txt']){
      try {
        await downloads.save({ filename: `${nombre}.${ext}`, data: texto });
        toast('Archivo exportado — ábrelo con Excel', 'ok');
        return;
      } catch(err){
        const code = err && err.code;
        if (code === 'extension_not_enabled') continue;      // reintenta como .txt
        if (code === 'declined') return;                      // el visitante canceló
        if (code === 'rate_limited'){ toast('Espera un momento antes de exportar de nuevo', 'err'); return; }
        toast('No se pudo exportar el archivo', 'err');
        return;
      }
    }
    toast('No se pudo exportar el archivo', 'err');
    return;
  }

  // Fuera del visor (archivo local o servidor propio) la descarga es directa.
  try {
    const blob = new Blob([texto], { type:'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `${nombre}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('Archivo exportado — ábrelo con Excel', 'ok');
  } catch(e){ toast('Este navegador no permitió la descarga', 'err'); }
}
window.__csv = {};
function csvDe(key){ const d = window.__csv[key]; if (d) exportarCSV(d.n, d.c, d.r()); }

/* ---------- Tablero ---------- */
VIEWS.tablero = () => {
  const hoyR = DB.rollos.filter(r => esHoy(r.fechaPesaje));
  const kgHoy = hoyR.reduce((s, r) => s + (r.pesoBruto || 0), 0);
  const pend = DB.rollos.filter(r => r.estado === 'pesado');
  const proc = DB.rollos.filter(r => r.estado === 'extruido' || r.estado === 'perfilado');
  const stock = DB.materiaPrima.reduce((s, m) => s + mpDisponible(m), 0);

  const porExt = DB.extrusoras.map(e => {
    const rs = DB.rollos.filter(r => (byId(DB.ordenes, r.oeId) || {}).extrusoraId === e.id);
    return { n:e.nombre, c:rs.length, kg: rs.reduce((s,r) => s + (r.pesoBruto||0), 0) };
  });
  const maxKg = Math.max(1, ...porExt.map(x => x.kg));

  const porOp = DB.operarios.filter(o => o.rol === 'extrusor').map(o => {
    const oes = DB.ordenes.filter(x => x.operarioId === o.id).map(x => x.id);
    const rs = DB.rollos.filter(r => oes.includes(r.oeId));
    return { n:`${o.nombre} ${o.apellido}`, c:rs.length, kg: rs.reduce((s,r)=>s+(r.pesoBruto||0),0) };
  }).sort((a,b) => b.kg - a.kg);
  const maxOp = Math.max(1, ...porOp.map(x => x.kg));

  const recientes = [...DB.rollos].sort((a,b) =>
    new Date(b.fechaPesaje || b.fechaPerfilado || 0) - new Date(a.fechaPesaje || a.fechaPerfilado || 0)).slice(0, 8);

  return pageHead('Tablero de producción',
    `Resumen del día y estado general de la planta. Bienvenido, ${esc(SESSION.nombre.split(' ')[0])}.`) +
  banner(`<b>Esto es un demo de propuesta.</b> Los datos son de ejemplo y simulan una semana de producción.
    Usa el panel <b>Simulador de hardware</b> abajo a la derecha para escanear códigos y pesar rollos como se haría en planta.`) +
  `<div class="grid g4" style="margin-bottom:14px">
    <div class="kpi"><div class="k">Rollos etiquetados hoy</div><div class="v">${hoyR.length}</div><div class="d">${kg(kgHoy)} kg producidos</div></div>
    <div class="kpi"><div class="k">Pendientes de despacho</div><div class="v">${pend.length}</div><div class="d">${kg(pend.reduce((s,r)=>s+(r.pesoBruto||0),0))} kg en piso</div></div>
    <div class="kpi"><div class="k">Rollos en proceso</div><div class="v">${proc.length}</div><div class="d">Extrusión y perfilado</div></div>
    <div class="kpi"><div class="k">Materia prima disponible</div><div class="v">${kg(stock)}<small>kg</small></div><div class="d">${DB.materiaPrima.filter(m=>m.estado!=='agotado').length} lotes en bodega</div></div>
  </div>

  <div class="grid g2" style="margin-bottom:14px">
    <div class="card"><div class="card-h"><h4>Producción por extrusora</h4><span class="sub">acumulado</span></div>
      <div class="card-b">${porExt.map(e => `
        <div class="bar-row"><span class="nm">${esc(e.n)}</span>
          <span class="track"><span class="fill" style="width:${(e.kg/maxKg*100).toFixed(1)}%"></span></span>
          <span class="vl">${kg(e.kg)} kg</span></div>`).join('')}
        <div class="helper" style="margin-top:8px">Comparar eficiencia entre las tres máquinas es uno de los reportes previstos en la hoja 10.</div>
      </div></div>
    <div class="card"><div class="card-h"><h4>Producción por operario extrusor</h4></div>
      <div class="card-b">${porOp.map(o => `
        <div class="bar-row"><span class="nm">${esc(o.n.split(' ')[0])}</span>
          <span class="track"><span class="fill" style="width:${(o.kg/maxOp*100).toFixed(1)}%"></span></span>
          <span class="vl">${o.c} rollos</span></div>`).join('')}
      </div></div>
  </div>

  <div class="card"><div class="card-h"><h4>Últimos rollos registrados</h4>
      <div class="acts"><a class="btn sm ghost" href="#/trazabilidad">Ver trazabilidad</a></div></div>
    <div class="card-b flush">${tabla([
      { t:'Código',    f:r => `<a class="mono" href="#/trazabilidad/${r.id}">${r.id}</a>` },
      { t:'Ancho',     f:r => `${r.ancho}"`, num:true },
      { t:'Color',     f:r => colorName((byId(DB.ordenes,r.oeId)||{}).colorId) },
      { t:'Extrusora', f:r => extName((byId(DB.ordenes,r.oeId)||{}).extrusoraId) },
      { t:'Peso bruto',f:r => kg(r.pesoBruto), num:true },
      { t:'Estado',    f:r => tag(r.estado) },
      { t:'Fecha',     f:r => r.fechaPesaje ? fmtDT(r.fechaPesaje) : r.fechaPerfilado ? fmtDT(r.fechaPerfilado) : '—' }
    ], recientes)}</div></div>`;
};

function editEnt(key, id){
  const E = ENTIDADES[key];
  const it = id ? byId(DB[E.col], id) : null;
  modal({
    title: (it ? 'Editar ' : 'Nuevo ') + E.t.toLowerCase().replace(/s$/,''),
    body: `<div class="formgrid">${E.fields.map(f => campo(f, it ? it[f.k] : undefined)).join('')}</div>`,
    onOk: () => {
      const v = leerCampos(E.fields); if (!v) return false;
      if (it){ Object.assign(it, v); bitacora('Editar ' + key, v.nombre || v.login || id); }
      else {
        const nid = Math.max(0, ...DB[E.col].map(x => Number(x.id) || 0)) + 1;
        DB[E.col].push({ id:nid, pass:'demo', ...v });
        bitacora('Crear ' + key, v.nombre || v.login || nid);
      }
      save(); route(); toast(it ? 'Registro actualizado' : 'Registro creado', 'ok');
    }
  });
}
function delEnt(key, id){
  const E = ENTIDADES[key], it = byId(DB[E.col], id);
  confirmar('Eliminar registro',
    `¿Eliminar "${it.nombre || it.login}"? En el sistema real este registro se inactivaría en lugar de borrarse, para no romper la trazabilidad histórica.`,
    () => { DB[E.col] = DB[E.col].filter(x => String(x.id) !== String(id));
            bitacora('Eliminar ' + key, it.nombre || it.login); save(); route(); toast('Registro eliminado', 'ok'); });
}

function nuevaOE(){
  const disp = DB.materiaPrima.filter(m => mpDisponible(m) > 0);
  if (!disp.length){ toast('No hay materia prima disponible en bodega', 'err'); return; }
  const fields = [
    { k:'extrusoraId', t:'Extrusora', type:'select', req:true, opts: optsDe(DB.extrusoras.filter(e=>e.estado==='activa'), e=>e.nombre) },
    { k:'operarioId', t:'Operario extrusor', type:'select', req:true, opts: optOperarios('extrusor') },
    { k:'mpId', t:'Lote de materia prima', type:'select', req:true, full:true,
      opts: disp.map(m => ({ v:m.id, t:`${m.id} · ${colorName(m.colorId)} · ${kg(mpDisponible(m))} kg disp.` })), on:'syncColorMP()' },
    { k:'kgConsumo', t:'Kg a consumir', type:'number', step:'0.1', req:true, def:150 },
    { k:'colorId', t:'Color del rollo', type:'select', req:true, opts: optsDe(DB.colores, c=>c.nombre) },
    { k:'calibreId', t:'Calibre', type:'select', req:true, opts: optsDe(DB.calibres, c=>`${c.diezmil} diezmil. (${c.micras} µ)`) },
    { k:'nRollos', t:'Rollos a generar', type:'number', req:true, def:3, help:'El sistema asigna un código nuevo a cada rollo.' },
    { k:'desperdicio', t:'Merma de arranque (kg)', type:'number', step:'0.1', def:3.5 },
    { k:'obs', t:'Observaciones', type:'textarea' }
  ];
  modal({
    title:'Nueva orden de extrusión', ok:'Registrar orden', wide:true,
    body: banner('Al guardar, el sistema descuenta la resina del inventario, crea la orden y genera un código único por cada rollo producido.') +
          `<div class="formgrid">${fields.map(f => campo(f)).join('')}</div>`,
    onOk: () => {
      const v = leerCampos(fields); if (!v) return false;
      const mp = byId(DB.materiaPrima, v.mpId);
      if (v.kgConsumo > mpDisponible(mp)){ toast(`El lote solo tiene ${kg(mpDisponible(mp))} kg disponibles`, 'err'); return false; }
      if (v.nRollos < 1 || v.nRollos > 12){ toast('Genera entre 1 y 12 rollos', 'err'); return false; }
      const d = new Date(); DB.seq.oe++;
      const oe = { id: codOE(v.extrusoraId, d, DB.seq.oe), extrusoraId:+v.extrusoraId, operarioId:+v.operarioId,
        colorId:+v.colorId, calibreId:+v.calibreId, inicio:d.toISOString(), fin:d.toISOString(),
        turno: d.getHours() < 14 ? 'Mañana' : 'Tarde',
        consumos:[{ mpId:mp.id, kg:+v.kgConsumo }], desperdicio:+(v.desperdicio||0), obs:v.obs||'' };
      DB.ordenes.push(oe);
      mp.consumido = +(mp.consumido + Number(v.kgConsumo)).toFixed(2);
      mp.estado = mpDisponible(mp) <= 0.5 ? 'agotado' : 'en uso';
      const nuevos = [];
      for (let i = 0; i < v.nRollos; i++){
        DB.seq.rollo++;
        const r = { id: codRollo(DB.seq.rollo), oeId:oe.id, ancho:null, largoTubo:null, perfiladorId:null,
          fechaPerfilado:null, pesoBruto:null, pesoNeto:null, metraje:null, basculaId:null,
          fechaPesaje:null, estado:'extruido', obs:'', despachoId:null };
        DB.rollos.push(r); nuevos.push(r.id);
      }
      bitacora('Orden de extrusión', `${oe.id} · ${v.nRollos} rollos`); save(); route(); renderHW();
      setTimeout(() => modal({ title:'Orden registrada', body:
        `<p style="margin:0 0 12px">Orden <b class="mono">${oe.id}</b> creada. Se generaron estos códigos de rollo,
         que ya pueden escanearse en la estación de perfilado:</p>
         <div class="card"><div class="card-b" style="display:flex;flex-wrap:wrap;gap:7px">
         ${nuevos.map(c => `<span class="tag n mono" style="font-size:.8rem;padding:5px 10px">${c}</span>`).join('')}
         </div></div>` }), 30);
    }
  });
  setTimeout(syncColorMP, 60);
}
function syncColorMP(){
  const s = $('#f-mpId'); if (!s) return;
  const mp = byId(DB.materiaPrima, s.value);
  const c = $('#f-colorId');
  if (mp && c) c.value = mp.colorId;
}

function panelPerf(cod){
  const r = byId(DB.rollos, cod);
  if (!r) return `<div class="banner" style="border-left-color:var(--danger);background:var(--danger-soft)">
    ${ICO.alert}<div>El código <b class="mono">${esc(cod)}</b> no existe en el sistema.
    Así reacciona la aplicación ante una etiqueta dañada o un código de otra planta.</div></div>`;
  if (r.estado !== 'extruido') return `<div class="banner" style="border-left-color:var(--warn);background:var(--warn-soft)">
    ${ICO.alert}<div>El rollo <b class="mono">${r.id}</b> está en estado <b>${ESTADOS[r.estado].t}</b>.
    Solo se perfilan rollos recién extruidos. <a href="#/trazabilidad/${r.id}">Ver su trazabilidad</a>.</div></div>`;
  const oe = byId(DB.ordenes, r.oeId);
  return `
    <div class="banner" style="background:var(--ok-soft);border-left-color:var(--ok)">${ICO.check}
      <div>Rollo <b class="mono">${r.id}</b> · ${esc(colorName(oe.colorId))} · ${esc(calName(oe.calibreId))} · ${esc(extName(oe.extrusoraId))}</div></div>

      <span id="pf-calc">12" ≈ 30,5 cm de película + 1 cm por lado = <b>${REGLAS.largoTubo(12)} cm</b> de tubo</span></div>

}
function calcTubo(){
  const a = Number($('#f-pf-ancho').value);
  const t = REGLAS.largoTubo(a);
  $('#f-pf-tubo').value = t;
  $('#pf-calc').innerHTML = `${a}" ≈ ${(a*2.54).toFixed(1).replace('.',',')} cm de película + 1 cm por lado = <b>${t} cm</b> de tubo`;
}
function guardarPerf(id){
  if(!puedeCapturar()){ toast('Tu perfil no puede registrar producción','err'); return; }
  const r = byId(DB.rollos, id);
  const op = Number($('#f-pf-op').value), ancho = Number($('#f-pf-ancho').value);
  if (!op || !ancho){ toast('Completa operario y ancho', 'err'); return; }
  r.perfiladorId = op; r.ancho = ancho; r.largoTubo = REGLAS.largoTubo(ancho);
  r.fechaPerfilado = new Date().toISOString(); r.estado = 'perfilado';
  bitacora('Perfilado', `${r.id} · ${ancho}"`); save(); renderHW();
  toast(`Rollo ${r.id} perfilado a ${ancho}" — ya puede pesarse`, 'ok');
  location.hash = '#/perfilado';
  setTimeout(() => { const f = $('#pf-cod'); if (f){ f.value=''; f.focus(); } }, 80);
}

}
function calcNeto(){
  const b = Number($('#f-bs-bruto').value);
  const n = $('#f-bs-neto'); if (n && b) n.value = (b - 0.42).toFixed(2);
}
function guardarBas(id){
  if(!puedeCapturar()){ toast('Tu perfil no puede registrar pesajes','err'); return; }
  const r = byId(DB.rollos, id);
  const op = Number($('#f-bs-op').value), bruto = Number($('#f-bs-bruto').value);
  if (!op || !bruto){ toast('Falta el operario o el peso', 'err'); return; }
  if (bruto <= 0 || bruto > 200){ toast('El peso no es válido para un rollo', 'err'); return; }
  r.basculaId = op; r.pesoBruto = +bruto.toFixed(2);
  r.pesoNeto = Number($('#f-bs-neto').value) || +(bruto - 0.42).toFixed(2);
  r.fechaPesaje = new Date().toISOString(); r.estado = 'pesado';
  bitacora('Pesaje y etiquetado', `${r.id} · ${kg(r.pesoBruto)} kg`); save(); renderHW();
  basculaTarar();
  verEtiqueta(r.id, true);
  toast(`Rollo ${r.id} pesado y etiquetado`, 'ok');
}

  const cod = $('#ds-cod').value.trim();

            mp.length ? [['Proveedor', esc(provName(mp[0].proveedorId))],
                         ['Color de resina', esc(colorName(mp[0].colorId))],

          ${paso(true, `Extrusión`, r.oe.id || '—',

/* ---------- Reportes ---------- */
VIEWS.reportes = () => {
  const rs = DB.rollos;
  const pend = rs.filter(r => r.estado === 'pesado');
  const desp = rs.filter(r => r.estado === 'despachado');

  const porOp = DB.operarios.map(o => {
    const oes = DB.ordenes.filter(x => x.operarioId === o.id).map(x => x.id);
    const ex = rs.filter(r => oes.includes(r.oeId));
    const pf = rs.filter(r => r.perfiladorId === o.id);
    const bs = rs.filter(r => r.basculaId === o.id);
    const tocados = new Set([...ex, ...pf, ...bs].map(r => r.id));
    const kgv = [...tocados].reduce((s,id) => s + ((byId(rs,id)||{}).pesoBruto || 0), 0);
    return { o, ex:ex.length, pf:pf.length, bs:bs.length, kgv };
  }).filter(x => x.ex || x.pf || x.bs);

  const porCli = DB.clientes.map(c => {
    const ds = DB.despachos.filter(d => d.clienteId === c.id);
    const ids = ds.flatMap(d => d.rollos);
    return { c, ds:ds.length, rollos:ids.length,
             kgv: ids.reduce((s,id) => s + ((byId(rs,id)||{}).pesoBruto||0), 0) };
  }).filter(x => x.ds);

  const colOp = [
    { t:'Operario', f:x=>esc(`${x.o.nombre} ${x.o.apellido}`) },
    { t:'Rol', f:x=>`<span class="tag n">${x.o.rol}</span>` },
    { t:'Extruidos', f:x=>x.ex, num:true },
    { t:'Perfilados', f:x=>x.pf, num:true },
    { t:'Pesados', f:x=>x.bs, num:true },
    { t:'Kg gestionados', f:x=>kg(x.kgv), num:true }
  ];
  const colCli = [
    { t:'Cliente', f:x=>esc(x.c.nombre) },
    { t:'Ciudad', f:x=>esc(x.c.ciudad||'—') },
    { t:'Despachos', f:x=>x.ds, num:true },
    { t:'Rollos', f:x=>x.rollos, num:true },
    { t:'Kg despachados', f:x=>kg(x.kgv), num:true }
  ];
  const colPend = [
    { t:'Código', f:r=>`<a class="mono" href="#/trazabilidad/${r.id}">${r.id}</a>` },
    { t:'Ancho', f:r=>`${r.ancho}"`, num:true },
    { t:'Color', f:r=>esc(colorName((byId(DB.ordenes,r.oeId)||{}).colorId)) },
    { t:'Peso', f:r=>kg(r.pesoBruto), num:true },
    { t:'Etiquetado', f:r=>fmtDT(r.fechaPesaje) }
  ];
  window.__csv.rop = { n:'produccion_por_operario', c:colOp, r:()=>porOp };
  window.__csv.rcl = { n:'despachos_por_cliente', c:colCli, r:()=>porCli };
  window.__csv.rpd = { n:'rollos_pendientes_despacho', c:colPend, r:()=>pend };

  return pageHead('Reportes e indicadores',
    'Los reportes previstos en la hoja 10 del documento. Cualquier listado se exporta a Excel — RF-29.') +
  `<div class="grid g4" style="margin-bottom:14px">
     <div class="kpi"><div class="k">Rollos producidos</div><div class="v">${rs.length}</div></div>
     <div class="kpi"><div class="k">Kg totales</div><div class="v">${kg(rs.reduce((s,r)=>s+(r.pesoBruto||0),0))}</div></div>
     <div class="kpi"><div class="k">Despachados</div><div class="v">${desp.length}</div><div class="d">en ${DB.despachos.length} salidas</div></div>
     <div class="kpi"><div class="k">Merma acumulada</div><div class="v">${kg(DB.ordenes.reduce((s,o)=>s+(o.desperdicio||0),0))}<small>kg</small></div></div>
   </div>
   <div class="card" style="margin-bottom:14px">
     <div class="card-h"><h4>Producción por operario y estación</h4>
       <div class="acts"><button class="btn sm ghost" onclick="csvDe('rop')">${ICO.down} Excel</button></div></div>
     <div class="card-b flush">${tabla(colOp, porOp)}</div></div>
   <div class="grid g2">
     <div class="card"><div class="card-h"><h4>Historial por cliente</h4>
        <div class="acts"><button class="btn sm ghost" onclick="csvDe('rcl')">${ICO.down} Excel</button></div></div>
       <div class="card-b flush">${tabla(colCli, porCli)}</div></div>
     <div class="card"><div class="card-h"><h4>Rollos pendientes de despacho</h4>
        <div class="acts"><button class="btn sm ghost" onclick="csvDe('rpd')">${ICO.down} Excel</button></div></div>
       <div class="card-b flush">${tabla(colPend, pend)}</div></div>
   </div>`;
};

/* ---------- Bitácora ---------- */
VIEWS.bitacora = () => {
  return pageHead('Bitácora de auditoría',
    'Quién hizo qué y cuándo. El documento exige no borrar registros de producción, solo anularlos con justificación — no funcional de integridad, hoja 6.') +
  banner('En el sistema real esta bitácora se alimenta automáticamente de cada cambio sobre cada registro, no solo de las acciones principales.') +
  `<div class="card"><div class="card-b flush">${tabla([
    { t:'Fecha y hora', f:l=>fmtDT(l.ts) },
    { t:'Usuario', f:l=>`<span class="mono">${esc(l.usuario)}</span>` },
    { t:'Acción', f:l=>esc(l.accion) },
    { t:'Detalle', f:l=>`<span class="mono" style="font-size:.8rem">${esc(l.detalle||'')}</span>` }
  ], DB.log, { empty:'Aún no hay movimientos registrados en esta sesión' })}</div></div>`;
};

   Arranque

DB = load(); save();
renderLogin();
renderHW();
